[Relay]
; false = ac_relay.asi does nothing at all
Enabled=true
; relay control endpoint host:port (port defaults to 21100); empty = off
Server=
; relay password, if the relay was started with --password
Password=
; log every relayed/control packet to ac_relay.log
Verbose=false
; wait (ms) before our own NAT probes also go via the relay; skipped if the peer reached us directly
RelayProbeDelayMs=80
; keep each peer at one address (drop its second path, e.g. its own relay while it uses ours)
OneAddressPerPeer=true

[IPv6]
; reach peers that also have IPv6 directly over IPv6 (no NAT); off by itself without global IPv6
Enabled=true
; UDP port for IPv6 (0 = random)
Port=0
